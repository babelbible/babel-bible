name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      - name: Install Lean toolchain (elan; pinned by lean/lean-toolchain)
        run: |
          curl https://elan.leanprover.dev/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build (aggregate Codex gate; mathlib oleans from cache)
        working-directory: lean
        run: |
          lake exe cache get
          lake build

      - name: Full validation (content + Lean gates; lake required)
        run: python3 scripts/validate_all.py

      - name: Codex import divergence check
        run: python3 scripts/check_codex_imports.py

      - name: Generated files clean (regenerate + diff)
        run: |
          python3 scripts/check_codex_imports.py --fix
          python3 scripts/build_lenses.py
          python3 scripts/integrate_unit.py --regenerate
          git diff --exit-code

      - name: Validator unit tests
        run: python3 -m unittest discover -s scripts/tests

  site:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # v5.6.0 — validate:content runs the Python validator first
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Content validation only (no lake/Mathlib needed here): the full
      # release validation, including the Lean gate, runs in the validate
      # job once.
      - name: Build site (npm ci + content validation + static build)
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Assert build outputs
        run: |
          test -f site/dist/index.html
          test -n "$(find site/dist/u -name '*.html' -print -quit)"
          test -n "$(find site/dist/specs -name '*.html' -print -quit)"
          test -n "$(find site/dist/dag -name '*.html' -print -quit)"
          test -n "$(find site/dist/connections -name '*.html' -print -quit)"
