<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Page not found | Babel Bible</title>
<style>
  :root {
    --bg: #0c0d10;
    --bg-elev: #16181d;
    --fg: #e8eaf0;
    --muted: #9aa0ae;
    --accent: #7ab0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
      "Helvetica Neue", "Noto Sans", sans-serif;
  }
  main {
    max-width: 34rem;
    padding: 2.5rem 1.5rem;
    text-align: center;
  }
  .code {
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--accent);
    margin: 0;
  }
  h1 { font-size: 1.4rem; margin: 0.75rem 0 1rem; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 1.5rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>This address doesn't correspond to any unit, essay, or reference
     page on Babel Bible. It may have moved, or the link that brought you
     here may be stale.</p>
  <p>
    <a href="/">Return to the front page</a>
    &nbsp;·&nbsp;
    <a href="/units">Browse all units</a>
  </p>
</main>
</body>
</html>
